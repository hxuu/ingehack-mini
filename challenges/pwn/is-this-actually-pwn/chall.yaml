name: "Is this actually pwn?"
author: derrm
category: pwn
hidden: true
description: |
  I wonder if this is actually a pwn challenge 

  Hints: the flag is in the env

  Reachable at **http://is-this-actually-pwn-<team-id>.challs.ingeniums.club:<tcp-mapped-port>** —
  plain HTTP, no TLS.
points: {min: 500, max: 1000}
tiebreakEligible: true
tags: [beginner, Buffer Overflow, Path Traversal, HTTP Protocol]
flagsDynamicBase: ingehack{gets_you_every_time}
flagsDynamicMode: auto
instanced: true
instancer:
  challengeIntegrationId: is-this-actually-pwn
  timeoutMilliseconds: 1800000
  extendable: true
  expose:
    - {kind: http, hostPrefix: is-this-actually-pwn, containerName: main, containerPort: 5000, shouldDisplay: true, title: "EsiMedia (HTTP)"}
  services:
    main:
      environment:
        RCTF_FLAG: ${RCTF_FLAG}
      user: "app"
      mem_limit: 256m
      read_only: false
      pids_limit: 128
      networks: [internal]
  networks:
    internal: {internal: true}
