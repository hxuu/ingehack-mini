description: |
  αυτοματοποίηση

  There are plenty of decisions to follow. Can you teach your tools to do
  the work?

  Download the stripped **x86-64 Linux ELF** and recover the input it accepts:

  ```sh
  chmod +x else_if
  ./else_if 'candidate'
  ```

  It runs on Linux or WSL. The accepted input is the flag.

  Flag format: `1ngh4ck{...}`

