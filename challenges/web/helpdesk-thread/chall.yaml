description: |
  You opened a support ticket with PackSwift about a parcel that never
  arrived. A support agent replied, and she keeps that reply on the desk side
  only.

  She reads every new message in the thread. She also keeps a ticket token
  in her browser that lets her act on the ticket.

  Post your message, then the run-bot form on this challenge page sends her
  to the desk view of the thread.

  > [!CONNECTION]
  > https://helpdesk-thread.challs.ingeniums.club:9488/

  Plain HTTP works on port 9487 if your tool prefers it.
