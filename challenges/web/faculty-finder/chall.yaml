description: |
  The Faculty of Sciences moved its module search online for 2025/2026. Type
  a module code and the results come back on the same page.

  A library assistant at the faculty keeps an eye on what students search
  for. Hand her a link and she opens it. When your page is ready, send it
  with the run-bot form on this challenge page.

  Find out what she wrote in her private note. Your inbox carries a claim
  code, and anything addressed to that code arrives in your inbox.

  > [!CONNECTION]
  > https://faculty-finder.challs.ingeniums.club:9488/

  Plain HTTP works on port 9487 if your tool prefers it.
