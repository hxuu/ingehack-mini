description: |
  StaffHub is the company intranet. Employees sign in and see their own
  profile: name, role, department and a few internal notes.

  The login page gives you a demo account so you can start right away. The
  developers are sure that "logged in" means "allowed". Are they right?

  This is a **shared** server: every team plays on the same copy.

  Reachable at **http://employee-profile.challs.ingeniums.club:9487/** or
  **https://employee-profile.challs.ingeniums.club:9488/** (scheme follows
  the port: 9487 is plain HTTP, 9488 is TLS).

  ### Hints — read only as many as you need

  1. Look at your own URL after logging in.
  2. Who is employee number 1?
  3. Try changing the number.
points: {min: 60, max: 100}
