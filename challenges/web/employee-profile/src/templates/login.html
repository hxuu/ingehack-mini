<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StaffHub &mdash; Sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <h1>StaffHub</h1>
      <p>Employee intranet</p>
    </div>
  </header>

  <main class="narrow">
    <section class="card">
      <h2>Sign in</h2>

      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <form method="post" action="{{ url_for('login') }}" class="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Sign in</button>
      </form>

      <div class="demo-box">
        <strong>Demo account</strong>
        <p>Username: <code>guest</code> &middot; Password: <code>guest123</code></p>
        <p class="muted">Use this account to explore StaffHub.</p>
      </div>
    </section>
  </main>

  <footer>
    <p>StaffHub &mdash; a tiny company intranet. All employees and data are fictional.</p>
  </footer>
</body>
</html>
