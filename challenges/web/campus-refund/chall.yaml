name: El Minha
category: web
author: hxuu
hidden: false
description: |
  You study at the University of Ingenium in Bab Ezzouar. Your minha
  (المنحة) is 2,000 DA a month, and this month it has not arrived. The
  finance office moved refunds online over the summer, so the counter now
  sends you to a web page.

  The minha officer approves refunds, and she opens any link a student sends
  her.

  Get her browser to approve a refund for you, then reload your statement.
  When your page is ready, send her the link with the run-bot form on this
  challenge page.

  > [!CONNECTION]
  > https://campus-refund.challs.ingeniums.club:9488/

  Plain HTTP works on port 9487 if your tool prefers it.
