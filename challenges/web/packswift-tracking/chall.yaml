name: Where Requests End
category: web
author: hxuu
hidden: false
description: |
  PackSwift's tracking page runs behind an edge that the team hardened last
  quarter. The application behind it did not get the same work, and nobody
  noticed because the two never disagreed in production.

  This one is hard. Asking for help is expected, and you will want a tool
  that lets you write requests by hand. The onboarding page explains how to
  set one up.

  > [!CONNECTION]
  > http://packswift-tracking-TEAM-ID.challs.ingeniums.club:9487/

  Replace `TEAM-ID` with the id shown on your challenge page. The instance is
  per team and speaks plain HTTP.
points: {min: 150, max: 500}
tiebreakEligible: true
tags: [hard, HTTP Protocol, Web Architecture]
flag: ingehack{tw0_parsers_disagreed_ab0ut_the_b0undary}
files:
  - name: proxy-setup.html
    path: files/proxy-setup.html
instanced: true
instancer:
  challengeIntegrationId: packswift-tracking
  timeoutMilliseconds: 1800000
  extendable: true
  expose:
    - kind: http
      hostPrefix: packswift-tracking
      containerName: main
      containerPort: 8080
      shouldDisplay: true
      title: "PackSwift Tracking (HTTP)"
  services:
    main:
      environment:
        FLAG: ${RCTF_FLAG}
      user: "app"
      mem_limit: 256m
      read_only: false
      pids_limit: 128
      networks: [internal]
  networks:
    internal: {internal: true}
