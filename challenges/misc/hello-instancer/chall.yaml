name: hello-instancer
author: hxuu
category: misc
description: |
  You get your **own copy** of this challenge — the platform spawns a private
  instance just for you (button on the challenge page), with its own container
  and **its own flag nobody else has**.

  1. Press **Start** on this page and wait a few seconds for the instance URL.
  2. Load `/flag` on your instance's host.
  3. Submit it on the platform. Your flag stays stable for your team.

  This challenge exercises all three connection kinds we use this event:
  plain **http**, **https**, and raw **tcp-over-TLS** (like pwn/nc
  challenges). All three routes lead to the same instance; the answer is the
  same flag.
points: {min: 100, max: 250}
tiebreakEligible: false
tags: [beginner, Browser Trust Boundaries, HTTP Protocol]
flagsDynamicBase: ingehack{this_base_has_plenty_lowercase_letters_for_leet}
flagsDynamicMode: auto
challengeIntegrationId: hello-instancer
instanced: true
instancer:
  timeoutMilliseconds: 1800000
  extendable: true
  expose:
    - {kind: http,    hostPrefix: hello-http,    containerName: main, containerPort: 80, title: "Plain HTTP"}
    - {kind: https,   hostPrefix: hello-https,   containerName: main, containerPort: 80, title: "HTTPS"}
    - {kind: tcp-ssl, hostPrefix: hello-tcp,     containerName: main, containerPort: 80, title: "TLS-wrapped TCP (nc-style)"}
  services:
    main:
      environment:
        RCTF_FLAG: ${RCTF_FLAG}
      mem_limit: 128m
      networks: [internal]
  networks:
    internal: {internal: true}


