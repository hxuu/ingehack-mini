name: every-step-counts
author: s4l1
category: misc
tiebreakEligible: true

description: |
  In late 2017, a fitness company pushed a massive data update.
  To civilians, it was a beautiful visualization of global human movement.
  To intelligence agencies, it was an operational security catastrophe.

  Soldiers and operatives deployed to the most remote corners of the earth
  had left their tracking on. Step by step, run by run, they quietly sketched
  the perimeters, patrol routes, and layouts of secret outposts directly onto
  a public map.

  A 20-year-old student noticed. The world unraveled from there.

  Five questions. One flag. No shortcuts.

  ---

  **Q1 — Which fitness tracking platform published this global heatmap?**

  **Q2 — Find the X (Twitter) username, without the @, of the 20-year-old
  Australian international security student who first noticed that the heatmap
  exposed military bases.**
  Capitalization as written on his profile.

  **Q3 — On what date (UTC) did he post the tweet exposing the bases?**
  Format: `DD-MM-YYYY`

  **Q4 — On 29 January 2018 the company's CEO published an open letter promising
  to review its features and simplify its privacy settings. What is his full name?**
  Format: `Firstname_Lastname`

  **Q5 — In July 2018, Bellingcat published a follow-up investigation showing
  that another fitness brand's app was exposing the home addresses of soldiers
  and intelligence staff. Which company?**
  Format: one word.
  Hint: `site:bellingcat.com fitness app soldiers home addresses`

  ---

  🚩 Combine the five answers into one flag: `ingehack{Q1_Q2_Q3_Q4_Q5}`

  Formatting rules: join the answers with `_`. Inside an answer, spaces become
  `_` and hyphens stay.
  Example with made-up answers "Alpha-1" and "Beta Two": `ingehack{Alpha-1_Beta_Two}`

points:
  min: 50
  max: 500

