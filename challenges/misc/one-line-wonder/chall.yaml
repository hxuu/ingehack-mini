name: one-line-wonder
author: s4l1
category: misc
hidden: true
tiebreakEligible: true

description: |
  **Briefing**
  A tiny service evaluates one line of Python for you. It calls itself
  hardened: builtins are gone, a handful of words is banned, and an audit
  hook refuses to open `/flag.txt`.

  **Rules**
  - one line, at most 90 characters
  - `__builtins__` is empty
  - input containing any of `import os sys open eval exec __ subclasses globals flag` is rejected
  - every failure is reported as `blocked`, with no clue which rule fired

  **Objective**
  Read `/flag.txt`.

  **Connection**
  The service is raw TCP behind the TLS terminator:

  > [!CONNECTION]
  > printf '%s\n' 'YOUR_PAYLOAD' | openssl s_client -quiet -connect one-line-wonder.challs.ingeniums.club:9450 -servername one-line-wonder.challs.ingeniums.club

  For an interactive session, run the same `openssl s_client ...` command and
  type your line once the connection is up. The service answers one line and
  closes the connection.

  **Hint**
  Python is more permissive about names than it looks.

difficulty: medium
points:
  min: 100
  max: 500

tags:
  - python
  - jail
  - sandbox escape
  - input validation
  - text processing

flag: ingehack{n0rm4l1z4t10n_1s_n0t_4_s4ndb0x}
instanced: false
# Raw-TCP route: ops/deploy-static.sh puts a Traefik TCP router on the tcp
# entrypoint (published as the mapped tcp-ssl port) for this container port.
tcpPort: 1337
