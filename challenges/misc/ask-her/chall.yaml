name: ask-her
author: boul3h14
category: misc
hidden: true
releaseTime: null
tiebreakEligible: true

description: |
  Our monitoring agent grabbed a nightly backup session minutes before the
  machine was wiped. What survived is everything we have, and it isn't a
  friendly shape:

  - `backup_corrupted.zip` — the backup archive, its index destroyed
  - `memory.raw` — a raw 16 MiB memory image taken shortly afterwards
  - `traffic.pcap` — the TLS upload of the backup session

  The backup tool that produced all of this is still inside the archive. It
  never wrote its keys to disk in plaintext — but nothing on this box can keep
  a secret if you look at the right layer.

  Recover the master secret of the upload, decrypt the TLS stream, and read the
  flag.

  **Getting the evidence**
  Press **Start** to spawn your instance. The evidence set is downloaded from
  your instance page — every team gets its own artifacts and its own flag, so
  another team's files will not give you their flag.

  > [!CONNECTION]
  > http://ask-her-<team-id>.challs.ingeniums.club:9487/

  **Hints**
  1. A ZIP without its index still has file headers. `unzip` fails; your parser
     will not.
  2. The tool inside the archive tells you which of its answers to believe —
     but only if you ask it the right way.
  3. Two of the three key fragments are hidden in plain sight: one in a picture
     you are not meant to look at, one in a blob of bytes you have to sweep.
  4. The capture is TLS 1.2 with Encrypt-then-MAC. Nothing in it makes sense
     until you have the master secret.

  🚩 Flag format: `ingehack{...}`

points:
  min: 100
  max: 500

tags:
  - misc
  - forensics
  - network
  - tls
  - memory-forensics
  - reverse-engineering
  - steganography
  - zip

# The flag entry is owned by the platform admin UI — the base can be edited
# there and every instance mints its team flag from it. This manifest value
# is what CI registers, so a merge here re-applies it.
#
# The base has 15 lowercase letters, so `mode: auto` mints per-team flags in
# "tail" form: ingehack{<base>_<10 hex chars>}. Each team's own minted flag
# is what the instance bakes into its capture.
flagsDynamicBase: ingehack{sh3_w4s_w41t1ng_f0r_y0u_t0_4sk}
flagsDynamicMode: auto

instanced: true
instancer:
  challengeIntegrationId: ask-her
  timeoutMilliseconds: 1800000
  extendable: true
  expose:
    - {kind: http, hostPrefix: ask-her, containerName: main, containerPort: 5000, shouldDisplay: true, title: "Ask Her evidence (HTTP)"}
  services:
    main:
      environment:
        RCTF_FLAG: ${RCTF_FLAG}
      user: "app"
      mem_limit: 384m
      read_only: false
      pids_limit: 128
      networks: [internal]
  networks:
    internal: {internal: true}
