name: sanity-check
author: hxuu
category: misc
description: |
  Your first flag — a sanity check that the challenge plumbing works: this
  page is a plain HTTP endpoint on the shared challenge server, and your
  browser reaches it directly.

  Reachable at **http://sanity-check.challs.ingeniums.club:9487/** or
  **https://sanity-check.challs.ingeniums.club:9488/** (the https:// before
  :9487 is exactly the mistake that makes Traefik 404 — port decides the
  scheme here, not the URL bar's default).

  1. Open your browser's developer tools (F12) → **Network** tab and reload:
     that row in front of you is the request your browser made and this page
     coming back.
  2. The flag is served on a different path of the same host.
  3. Submit it on the platform.

  This one is shared — every team sees the same flag. When you're done, you'll
  have used: HTTP requests and paths, and reading a response.
points: {min: 100, max: 250}
tiebreakEligible: false
tags: [beginner, HTTP Protocol]
flag: ingehack{http_is_just_requests}
instanced: false




