name: sanity-check
author: hxuu
category: misc
hidden: false
description: |
  **Welcome to Ingehack Mini.**

  There is nothing to prove here — this one exists so you can get comfortable
  with the platform. It is worth **0 points**, so it never moves the
  scoreboard. Take your time.

  What you need:

  1. Most challenges give you a description, a flag box, and sometimes files.
     This one has no files: the challenge *is* a website.
  2. Open **http://sanity-check.challs.ingeniums.club:9487/** (plain HTTP) or
     **https://sanity-check.challs.ingeniums.club:9488/** (TLS). The port
     decides the scheme — `https://` on :9487 is the mistake that makes
     Traefik answer 404, not your browser being broken.
  3. Read the page it serves, follow the one instruction on it, and paste the
     flag into the box below.

  While you are there, open your browser's developer tools (F12) and switch to
  the **Network** tab, then reload. Every request your browser made and every
  answer it got back is in that list. A good part of this event is just
  reading that list.

  Stuck? Ask a mentor — that is what they are for. Good luck, and have fun.

  This one is shared: every team sees the same flag.
