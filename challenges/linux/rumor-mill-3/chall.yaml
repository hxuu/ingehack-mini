name: rumor-mill-3
author: boul3h14
category: linux
hidden: true
tiebreakEligible: false

description: |
  Rumor Mill #3 — The Liars' Club
  ────────────────────────────────
  Every note on this box is a lie. Every history. Every confession.
  Every "audit copy." Even the filenames lie.

  You start as y4ss1n3. You'll need to become n0d4, then boul3h14. At
  each step, someone is lying to you.

  Find the flag. Trust nothing until you've verified it yourself.

  Flag format: ingehack{...}

  **Connection:** SSH runs behind the TLS terminator, so wrap the client
  (the mapped `tcp-ssl` port is 9450):

  ```sh
  ssh -o ProxyCommand='openssl s_client -quiet -servername %h -connect %h:%p' \
      y4ss1n3@rumor-mill-3.challs.ingeniums.club -p 9450
  ```

  Password: `4rt4z4`. A TTY is required — `su` prompts on the terminal, so a
  raw `nc` session cannot complete the chain.

difficulty: hard
# The ingest schema (ops/chall-payload.py) reads points.min/max. Both are 500
# so the challenge is exactly the spec's 500 points.
points:
  min: 500
  max: 500

tags:
  - hard
  - linux
  - forensics
  - su
  - base64
  - openssl
  - decoy

flag: ingehack{3v3ry0n3_l13d_bu7_th3_l0g_d1dn7}
instanced: false
# Raw-TCP route: ops/deploy-static.sh puts a Traefik TCP router on the tcp
# entrypoint (published as the mapped tcp-ssl port, 9450) for this port.
tcpPort: 2222
