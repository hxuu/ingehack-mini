[libdefaults]
    default_realm = ESI-SBA.DZ
    ticket_lifetime = 1s
    renew_lifetime = 2s
    forwardable = true
    rdns = false
    dns_lookup_realm = false
    dns_lookup_kdc = false

[realms]
    ESI-SBA.DZ = {
        kdc = 127.0.0.1:88
        admin_server = 127.0.0.1:749
        default_domain = esi-sba.dz
    }

[domain_realm]
    .esi-sba.dz = ESI-SBA.DZ
    esi-sba.dz = ESI-SBA.DZ
    localhost = ESI-SBA.DZ
