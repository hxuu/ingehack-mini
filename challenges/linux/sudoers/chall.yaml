name: sudoers
author: boul3h14
category: linux
hidden: false
tiebreakEligible: true

description: |
  **Briefing**
  A small company built an internal audit tool and moved on. The developer's
  final note claims the dangerous part is solved:

  > "We drop privileges before we touch any user code. No more command
  > injection."

  The claim has never been tested. You have a shell on the box. The rest is
  yours to discover.

  **Objective**
  Read `/flag`.

  **Connection**
  Press **Start** to spawn your instance. SSH sits behind the TLS terminator,
  so wrap the client (the mapped `tcp-ssl` port is 9450):

  > [!CONNECTION]
  > ssh -o ProxyCommand='openssl s_client -quiet -servername %h -connect %h:%p' ctf@<INSTANCE_HOST> -p 9450

  Password: `ctf`

  **Hint**
  A privilege drop is only as strong as the API that performs it.

difficulty: medium
points:
  min: 100
  max: 500

tags:
  - medium
  - setuid
  - SUID
  - privilege escalation
  - linux
  - seteuid

flag: ingehack{seteuid_leaves_suid_restorable}
instanced: true
instancer:
  # Stable id — keep across renames/updates.
  challengeIntegrationId: sudoers
  timeoutMilliseconds: 1800000
  extendable: true
  expose:
    - kind: tcp-ssl
      hostPrefix: sudoers
      containerName: sudoers
      containerPort: 22
      shouldDisplay: true
      title: "SSH (via TLS)"
  services:
    sudoers:
      hostname: challenge-sudoers
      environment:
        # the instancer bakes the per-team value into ${RCTF_FLAG}; the
        # entrypoint writes it root-only to /flag
        FLAG: ${RCTF_FLAG}
      # no-new-privileges must NOT apply: the intended path exploits a
      # setuid-root binary (auditdrop); the instancer default would block
      # setuid from gaining privileges.
      security_opt: []
      cap_drop: [ALL]
      cap_add:
        - CHOWN
        - DAC_OVERRIDE
        - FOWNER
        - SETUID
        - SETGID
        - SYS_CHROOT
        - AUDIT_WRITE
        - KILL
      mem_limit: 256m
      read_only: false
      pids_limit: 128
      networks: [ctf-internal]
  # the service above references this network; it must be declared here
  # (see fix/rumor-instancer-networks) or registration fails with HTTP 400
  networks:
    ctf-internal:
      driver: bridge
      internal: true
