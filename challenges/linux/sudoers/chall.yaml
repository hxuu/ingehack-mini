name: sudoers
author: boul3h14
category: linux
hidden: true
tiebreakEligible: true

description: |
  **Briefing**
  A small company built an internal audit tool and moved on. The developer's
  final note claims the dangerous part is solved:

  > "We drop privileges before we touch any user code. No more command
  > injection."

  The claim has never been tested. You have a shell on the box. The rest is
  yours to discover.

  **Objective**
  Read `/flag`.

  **Connection**
  SSH sits behind the TLS terminator, so wrap the client:
  ```sh
  ssh -o ProxyCommand='openssl s_client -quiet -servername %h -connect %h:%p' \
      ctf@sudoers.challs.ingeniums.club -p 9450
  ```
  Password: `ctf`

  **Hint**
  A privilege drop is only as strong as the API that performs it.

difficulty: medium
points:
  min: 200
  max: 500

tags:
  - medium
  - setuid
  - SUID
  - privilege escalation
  - linux
  - seteuid

flag: ingehack{seteuid_leaves_suid_restorable}
instanced: false
# Raw-TCP route: ops/deploy-static.sh puts a Traefik TCP router on the tcp
# entrypoint (published as the mapped tcp-ssl port) for this container port.
tcpPort: 22
