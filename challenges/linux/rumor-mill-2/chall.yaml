name: rumor-mill-2
author: boul3h14
category: linux
hidden: false
tiebreakEligible: false

description: |
  Rumors spread fast, but this one was encoded all the way down.

  Welcome back to the box. You've got an entry account, some stale notes,
  and a trail of rotated secrets. Can you follow the trail through the accounts
  and extract the encrypted prize?

  Find the flag. Trust nothing until you've verified it.

  **Connection:** Press **Start** to spawn your instance. SSH runs behind the
  TLS terminator, so wrap the client (the mapped `tcp-ssl` port is 9450):

  > [!CONNECTION]
  > ssh -o ProxyCommand='openssl s_client -quiet -servername %h -connect %h:%p' y4ss1n3@<INSTANCE_HOST> -p 9450

  Password: `Welcome123`. A TTY is required: `su` prompts on the terminal, so
  a raw `nc` session cannot complete the chain.

  **Goal:** read the real flag and submit it.

  Flag format: `ingehack{...}`

difficulty: medium
points:
  min: 100
  max: 500

tags:
  - medium
  - linux
  - privilege escalation
  - su
  - pam
  - base64
  - openssl
  - permissions

flag: ingehack{rum0rs_4r3_b4s364_4ll_th3_w4y_d0wn}
instanced: true
instancer:
  # Stable id — keep across renames/updates.
  challengeIntegrationId: rumor-mill-2
  timeoutMilliseconds: 1800000
  extendable: true
  expose:
    - kind: tcp-ssl
      hostPrefix: rumor-mill-2
      containerName: rumor-mill-2
      containerPort: 2222
      shouldDisplay: true
      title: "SSH (via TLS)"
  services:
    rumor-mill-2:
      hostname: challenge-rumor-mill-2
      environment:
        # the instancer bakes the per-team value into ${RCTF_FLAG}; the
        # entrypoint stages it root-only and re-execs with env -i
        FLAG: ${RCTF_FLAG}
        SSH_PORT: "2222"
      # no-new-privileges must NOT apply: the intended chain runs `su`
      # (setuid), which it would block. Verified with the instancer default:
      # su fails "The 'no new privileges' flag is set"; with an empty
      # security_opt, su works and the chain completes.
      security_opt: []
      cap_drop: [ALL]
      cap_add:
        - CHOWN
        - DAC_OVERRIDE
        - FOWNER
        - SETUID
        - SETGID
        - SYS_CHROOT
        - AUDIT_WRITE
        - KILL
      mem_limit: 256m
      read_only: false
      pids_limit: 128
      networks: [ctf-internal]
  # per-instance network; the service above references it, so it must be
  # declared here (same as escape) or the rCTF upsert rejects the payload
  networks:
    ctf-internal:
      driver: bridge
      internal: true
