name: rumor-mill-2
author: boul3h14
category: linux
hidden: false
tiebreakEligible: false

description: |
  Rumors spread fast, but this one was encoded all the way down.

  Welcome back to the box. You've got an entry account, some stale notes,
  and a trail of rotated secrets. Can you follow the trail through the accounts
  and extract the encrypted prize?

  Find the flag. Trust nothing until you've verified it.

  **Connection:** SSH runs behind the TLS terminator, so wrap the client (the
  mapped `tcp-ssl` port is 9450):

  > [!CONNECTION]
  > ssh -o ProxyCommand='openssl s_client -quiet -servername %h -connect %h:%p' y4ss1n3@rumor-mill-2.challs.ingeniums.club -p 9450

  Password: `Welcome123`. A TTY is required: `su` prompts on the terminal, so
  a raw `nc` session cannot complete the chain.

  **Goal:** read the real flag and submit it.

  Flag format: `ingehack{...}`

difficulty: medium
points:
  min: 200
  max: 500

tags:
  - medium
  - linux
  - privilege escalation
  - su
  - pam
  - base64
  - openssl
  - permissions

flag: ingehack{rum0rs_4r3_b4s364_4ll_th3_w4y_d0wn}
instanced: false
# Raw-TCP route: ops/deploy-static.sh puts a Traefik TCP router on the tcp
# entrypoint (published as the mapped tcp-ssl port) for this container port.
tcpPort: 2222
